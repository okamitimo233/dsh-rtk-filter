name: RTK installer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Official install script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Install RTK with the upstream script and run --version
        run: npm run smoke
